<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabD’Or — visualização mobile</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #dfe7ee; font-family: sans-serif; }
    .device { width: 390px; max-width: 100%; height: min(844px, calc(100vh - 48px)); overflow: hidden; border: 10px solid #132b42; border-radius: 36px; background: white; box-shadow: 0 28px 70px rgba(0,40,85,.28); }
    iframe { width: 100%; height: 100%; display: block; border: 0; }
  </style>
</head>
<body>
  <div class="device"><iframe src="index.html" title="Protótipo LabD’Or em viewport mobile"></iframe></div>
</body>
</html>
